{% extends "base.html" %}

{% block title %}Login | askJB{% endblock %}

{% block content %}
<main class="login-page">
    <section class="card login-card">
        <div class="brand">ask<span>JB</span></div>

        <div class="heading">
            <p class="eyebrow">PRIVATE AREA</p>
            <h1>Welcome back.</h1>
        </div>

        <form class="login-form" method="POST">
            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            {% if error %}
                <p class="form-status">{{ error }}</p>
            {% endif %}

            <button type="submit">Log in</button>
        </form>
    </section>
</main>
{% endblock %}
